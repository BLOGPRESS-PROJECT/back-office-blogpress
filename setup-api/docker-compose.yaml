services:
  api:
    build:
      context: ..
      dockerfile: setup-api/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-2025-01-01}
        VERSION: ${VERSION:-1.0.0}
    image: blogpress-api:${VERSION:-latest}
    container_name: blogpress-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:8090"
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}

      # MongoDB - ✅ CORRECTION : utiliser le nom du container "blogpress-mongodb"
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-qwerty87}@blogpress-mongodb:27017/${MONGO_DATABASE:-blogpress}?authSource=admin

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}

      # URLs
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8090}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-bendjibril789@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-azerty@78942004}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Azerty_78}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Super}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-Admin}

      # File Storage
      FILE_STORAGE_BASE_PATH: /app/uploads
      FILE_STORAGE_MAX_FILE_SIZE: ${FILE_STORAGE_MAX_SIZE:-5242880}

      # Java Options
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}

    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    networks:
      - blogpress-network
    # ❌ SUPPRIMÉ : depends_on car mongodb est dans un autre fichier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  api-uploads:
    name: blogpress-api-uploads
    driver: local
  api-logs:
    name: blogpress-api-logs
    driver: local

networks:
  blogpress-network:
    name: blogpress-network
    external: true  # ✅ CORRECT : utilise le réseau créé par setup-db
# ==========================================
# Frontend React - Reverse Proxy
# ==========================================

# Upstream : serveur frontend
upstream frontend_backend {
    server blogpress-frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ==========================================
# Redirection HTTP → HTTPS (à activer après SSL)
# ==========================================
# server {
#     listen 80;
#     server_name blogpress-app.com www.blogpress-app.com;
#     return 301 https://www.blogpress-app.com$request_uri;
# }

# ==========================================
# Frontend - HTTP (avant SSL)
# ==========================================
server {
    listen 80;
    server_name blogpress-app.com www.blogpress-app.com localhost;

    # Logs
    access_log /var/log/nginx/frontend_access.log main;
    error_log /var/log/nginx/frontend_error.log warn;

    # Redirection non-www → www
    if ($host = 'blogpress-app.com') {
        return 301 http://www.blogpress-app.com$request_uri;
    }

    # ==========================================
    # Proxy vers React
    # ==========================================
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket pour Hot Module Replacement (dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # Cache des assets statiques
    # ==========================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_backend;

        # Cache agressif pour les assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================
    # Certbot challenge
    # ==========================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


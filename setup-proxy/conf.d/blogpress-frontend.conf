# ==========================================
# Frontend React - Reverse Proxy
# ==========================================

upstream frontend_backend {
    server blogpress-webapp:80;
    keepalive 32;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name blogpress-app.com www.blogpress-app.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTPS (après obtention du certificat)
    location / {
        return 301 https://www.blogpress-app.com$request_uri;
    }
}

# Redirection non-www → www (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name blogpress-app.com;

    ssl_certificate /etc/letsencrypt/live/blogpress-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blogpress-app.com/privkey.pem;

    return 301 https://www.blogpress-app.com$request_uri;
}

# Configuration HTTPS principale
server {
    listen 443 ssl;
    http2 on;
    server_name www.blogpress-app.com;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/www.blogpress-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.blogpress-app.com/privkey.pem;

    # Protocoles et ciphers SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logs
    access_log /var/log/nginx/frontend_access.log main;
    error_log /var/log/nginx/frontend_error.log warn;

    # Proxy vers React
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
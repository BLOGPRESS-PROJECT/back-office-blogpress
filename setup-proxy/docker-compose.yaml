version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: blogpress-nginx:latest
    container_name: blogpress-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - blogpress-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx-logs:
    name: blogpress-nginx-logs
  certbot-certs:
    name: blogpress-certbot-certs
  certbot-www:
    name: blogpress-certbot-www

networks:
  blogpress-network:
    name: blogpress-network
    external: true
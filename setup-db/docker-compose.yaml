services:
  # ==========================================
  # MONGODB DATABASE
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: blogpress-mongodb
    restart: unless-stopped
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-qwerty87}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-blogpress}
    
    ports:
      - "${MONGO_PORT:-27017}:27017"
    
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    
    networks:
      - blogpress-network
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    
    command: ["--auth"]

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mongodb-data:
    name: blogpress-mongodb-data
    driver: local
  mongodb-config:
    name: blogpress-mongodb-config
    driver: local

# ==========================================
# RÉSEAUX
# ==========================================
networks:
  blogpress-network:
    name: blogpress-network
    driver: bridge


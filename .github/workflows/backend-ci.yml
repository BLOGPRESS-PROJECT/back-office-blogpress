name: 🐳 Build & Push Docker Image

# ==========================================
# DÉCLENCHEMENT
# ==========================================
# Ce workflow se déclenche :
# - Sur push vers la branche master
# - Sur pull request vers master (pour tester)
# - Manuellement depuis l'onglet Actions (workflow_dispatch)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:  # Permet de déclencher manuellement depuis GitHub

# ==========================================
# VARIABLES GLOBALES
# ==========================================
env:
  DOCKER_IMAGE: azerty78/blogpress-api
  DOCKERFILE_PATH: setup-api/Dockerfile
  DOCKER_CONTEXT: .
  NGINX_IMAGE: azerty78/blogpress-nginx
  NGINX_DOCKERFILE_PATH: setup-proxy/Dockerfile
  NGINX_DOCKER_CONTEXT: setup-proxy

# ==========================================
# JOBS
# ==========================================
jobs:
  # ==========================================
  # JOB 1: Create Git Tags
  # ==========================================
  tags:
    name: 🏷️ Create Git Tags
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📋 Tag Info
        run: |
          echo "✅ Informations sur les tags Git"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          
          # Afficher les tags existants
          git tag -l | head -10 || echo "Aucun tag trouvé"
          
          # Si c'est un push sur master, afficher les informations
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "📌 Push sur master détecté"
            echo "Commit: ${{ github.sha }}"
            echo "Message: $(git log -1 --pretty=%B)"
          fi

  # ==========================================
  # JOB 2: Run Tests
  # ==========================================
  test:
    name: 🧪 Tests Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧪 Run tests
        run: ./gradlew clean test

  # ==========================================
  # JOB 3: Build Docker Image
  # ==========================================
  build:
    needs: [tags, test]
    name: 🔨 Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1: Checkout du code
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # Étape 2: Nettoyer et recréer les contextes Docker correctement
      - name: 🧹 Setup Docker Properly
        run: |
          # Supprimer buildx et contextes corrompus
          rm -rf ~/.docker/buildx 2>/dev/null || true
          rm -rf ~/.docker/contexts 2>/dev/null || true
          
          # Recréer la structure de contextes correctement
          mkdir -p ~/.docker/contexts/meta
          
          # Créer le répertoire pour le contexte "." (hash de l'erreur)
          CONTEXT_DIR=~/.docker/contexts/meta/cdb4ee2aea69cc6a83331bbe96dc2caa9a299d21329efb0336fc02a82e1839a8
          mkdir -p "$CONTEXT_DIR"
          
          # Créer le fichier meta.json pour le contexte "."
          cat > "$CONTEXT_DIR/meta.json" <<'EOF'
          {
            "Name": ".",
            "Metadata": {
              "Description": "Default context"
            },
            "Endpoints": {
              "docker": {
                "Host": "unix:///var/run/docker.sock",
                "SkipTLSVerify": false
              }
            }
          }
          EOF
          
          # Vérifier que le fichier a été créé
          if [ -f "$CONTEXT_DIR/meta.json" ]; then
            echo "✅ Contexte Docker '.' créé avec succès"
          else
            echo "❌ Erreur: Impossible de créer le contexte"
            exit 1
          fi
      
      # Étape 3: Login à DockerHub 
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      # Étape 3b: Vérifier le login
      - name: ✅ Verify DockerHub Login
        run: |
          echo "✅ Login DockerHub réussi"
          
          # Test: essayer de pull gradle:8.5-jdk21 pour vérifier l'authentification
          echo "Test: Pull de gradle:8.5-jdk21..."
          docker pull gradle:8.5-jdk21 || {
            echo "❌ Erreur: Impossible de pull gradle:8.5-jdk21"
            echo "Vérification du config.json..."
            cat ~/.docker/config.json || echo "⚠️ Pas de config.json"
            exit 1
          }
          echo "✅ Pull de gradle:8.5-jdk21 réussi"
      
      # Étape 4: Extract metadata (tags, labels)
      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Étape 5: Build Docker Image (le contexte "." existe maintenant)
      - name: 🔨 Build Docker Image
        env:
          DOCKER_BUILDKIT: 0
        run: |
          # Vérifier que le login fonctionne
          echo "Vérification de l'authentification DockerHub..."
          docker info | grep -i "username" || echo "⚠️ Pas de username dans docker info (peut être normal)"
          
          # Préparer les tags
          TAGS="${{ steps.meta.outputs.tags }}"
          if [ -z "$TAGS" ]; then
            # Fallback si metadata-action ne fonctionne pas
            TAGS="${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          fi
          
          # Construire les arguments --tag
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          
          # Construire l'image (le contexte "." devrait maintenant exister)
          # Utiliser --pull pour forcer le pull des images de base avec authentification
          docker build \
            --pull \
            --file ${{ env.DOCKERFILE_PATH }} \
            $TAG_ARGS \
            ${{ env.DOCKER_CONTEXT }}
          
          # Push l'image si ce n'est pas une PR
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for tag in $TAGS; do
              echo "Pushing $tag..."
              docker push $tag
            done
          fi
      
      # Étape 6: Afficher les informations de l'image
      - name: 📊 Image Info
        if: success()
        run: |
          echo "✅ Image buildée avec succès!"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          docker images | grep "${{ env.DOCKER_IMAGE }}"
  
  # ==========================================
  # JOB 4: Build & Push Nginx Image
  # ==========================================
  build-nginx:
    needs: [tags, test]
    name: 🔨 Build & Push Nginx Image
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1: Checkout du code
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # Étape 2: Nettoyer et recréer les contextes Docker correctement
      - name: 🧹 Setup Docker Properly
        run: |
          # Supprimer buildx et contextes corrompus
          rm -rf ~/.docker/buildx 2>/dev/null || true
          rm -rf ~/.docker/contexts 2>/dev/null || true
          
          # Recréer la structure de contextes correctement
          mkdir -p ~/.docker/contexts/meta
          
          # Créer le contexte par défaut "." (nécessaire pour docker run)
          DEFAULT_CONTEXT_DIR=~/.docker/contexts/meta/cdb4ee2aea69cc6a83331bbe96dc2caa9a299d21329efb0336fc02a82e1839a8
          mkdir -p "$DEFAULT_CONTEXT_DIR"
          
          # Créer le fichier meta.json pour le contexte par défaut
          cat > "$DEFAULT_CONTEXT_DIR/meta.json" <<'EOF'
          {
            "Name": ".",
            "Metadata": {
              "Description": "Default context"
            },
            "Endpoints": {
              "docker": {
                "Host": "unix:///var/run/docker.sock",
                "SkipTLSVerify": false
              }
            }
          }
          EOF
          
          # Vérifier que le fichier a été créé
          if [ -f "$DEFAULT_CONTEXT_DIR/meta.json" ]; then
            echo "✅ Contexte Docker par défaut créé avec succès"
          else
            echo "❌ Erreur: Impossible de créer le contexte par défaut"
            exit 1
          fi
      
      # Étape 3: Login à DockerHub 
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      # Étape 3b: Tester la syntaxe Nginx
      - name: ✅ Test Nginx Configuration
        run: |
          echo "🔍 Test de la syntaxe Nginx..."
          
          # Pull l'image nginx:alpine pour le test
          docker pull nginx:alpine || echo "Image déjà présente"
          
          # Créer un conteneur temporaire pour tester la config
          # Utiliser le chemin absolu pour éviter les problèmes
          ABS_PATH=$(pwd)
          
          # Tester la syntaxe (les erreurs de résolution DNS sont normales dans l'environnement de test)
          OUTPUT=$(docker run --rm \
            -v "$ABS_PATH/setup-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$ABS_PATH/setup-proxy/conf.d:/etc/nginx/conf.d:ro" \
            nginx:alpine \
            nginx -t 2>&1) || true
          
          # Vérifier si c'est une erreur de syntaxe ou juste de résolution DNS
          if echo "$OUTPUT" | grep -q "host not found in upstream"; then
            echo "⚠️  Avertissement: Résolution DNS échouée (normal dans l'environnement de test)"
            echo "✅ La syntaxe Nginx est valide (les hôtes seront résolus en production)"
          elif echo "$OUTPUT" | grep -q "configuration file.*test is successful"; then
            echo "✅ Configuration Nginx valide!"
          elif echo "$OUTPUT" | grep -q "syntax is ok"; then
            echo "✅ Configuration Nginx valide!"
          else
            echo "❌ Erreur dans la configuration Nginx:"
            echo "$OUTPUT"
            exit 1
          fi
      
      # Étape 4: Extract metadata (tags, labels)
      - name: 📋 Extract metadata
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NGINX_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Étape 5: Build Docker Image Nginx
      - name: 🔨 Build Nginx Docker Image
        env:
          DOCKER_BUILDKIT: 0
        run: |
          # Préparer les tags
          TAGS="${{ steps.meta-nginx.outputs.tags }}"
          if [ -z "$TAGS" ]; then
            # Fallback si metadata-action ne fonctionne pas
            TAGS="${{ env.NGINX_IMAGE }}:latest ${{ env.NGINX_IMAGE }}:${{ github.sha }}"
          fi
          
          # Construire les arguments --tag
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          
          # Construire l'image Nginx
          docker build \
            --pull \
            --file ${{ env.NGINX_DOCKERFILE_PATH }} \
            $TAG_ARGS \
            ${{ env.NGINX_DOCKER_CONTEXT }}
          
          # Push l'image si ce n'est pas une PR
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for tag in $TAGS; do
              echo "Pushing $tag..."
              docker push $tag
            done
          fi
      
      # Étape 6: Afficher les informations de l'image
      - name: 📊 Nginx Image Info
        if: success()
        run: |
          echo "✅ Image Nginx buildée avec succès!"
          echo "📦 Image: ${{ env.NGINX_IMAGE }}"
          echo "🏷️  Tags: ${{ steps.meta-nginx.outputs.tags }}"
          docker images | grep "${{ env.NGINX_IMAGE }}"
  
  # ==========================================
  # JOB 5: Test Docker Image (optionnel pour l'instant)
  # ==========================================
  test-image:
    name: 🧪 Test Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'  # Skip tests sur PR
    
    steps:
      # Étape 1: Checkout
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # Étape 2: Nettoyer et recréer les contextes Docker correctement
      - name: 🧹 Setup Docker Properly
        run: |
          # Supprimer buildx et contextes corrompus
          rm -rf ~/.docker/buildx 2>/dev/null || true
          rm -rf ~/.docker/contexts 2>/dev/null || true
          
          # Recréer la structure de contextes correctement
          mkdir -p ~/.docker/contexts/meta
          
          # Créer le répertoire pour le contexte "." (hash de l'erreur)
          CONTEXT_DIR=~/.docker/contexts/meta/cdb4ee2aea69cc6a83331bbe96dc2caa9a299d21329efb0336fc02a82e1839a8
          mkdir -p "$CONTEXT_DIR"
          
          # Créer le fichier meta.json pour le contexte "."
          cat > "$CONTEXT_DIR/meta.json" <<'EOF'
          {
            "Name": ".",
            "Metadata": {
              "Description": "Default context"
            },
            "Endpoints": {
              "docker": {
                "Host": "unix:///var/run/docker.sock",
                "SkipTLSVerify": false
              }
            }
          }
          EOF
          
          # Vérifier que le fichier a été créé
          if [ -f "$CONTEXT_DIR/meta.json" ]; then
            echo "✅ Contexte Docker '.' créé avec succès"
          else
            echo "❌ Erreur: Impossible de créer le contexte"
            exit 1
          fi
      
      # Étape 3: Login à DockerHub
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      # Étape 4: Pull l'image buildée
      - name: 🐳 Pull Docker Image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest || echo "Image not found, will build locally"
      
      # Étape 5: Test basique (vérifier que le conteneur démarre)
      - name: ✅ Test Container Start
        run: |
          # Démarrer le conteneur
          echo "🚀 Démarrage du conteneur..."
          docker run -d --name test-container -p 8090:8090 ${{ env.DOCKER_IMAGE }}:latest || docker run -d --name test-container -p 8090:8090 ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          
          # Attendre un peu que le conteneur démarre
          echo "⏳ Attente du démarrage du conteneur..."
          sleep 10
          
          # Vérifier que le conteneur est en cours d'exécution
          echo "📊 État du conteneur:"
          docker ps --filter "name=test-container" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          # Vérifier que le conteneur est toujours en vie (pas de crash)
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' test-container 2>/dev/null || echo "not-found")
          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "❌ Le conteneur n'est pas en cours d'exécution. Statut: $CONTAINER_STATUS"
            echo "📋 Logs du conteneur:"
            docker logs test-container --tail 100
            echo "📊 État détaillé:"
            docker ps -a --filter "name=test-container"
            exit 1
          fi
          
          # Vérifier que le port est accessible (même si l'API ne répond pas correctement sans MongoDB)
          echo "🔍 Vérification de l'accessibilité du port 8090..."
          if timeout 5 bash -c 'until nc -z localhost 8090; do sleep 1; done' 2>/dev/null; then
            echo "✅ Le port 8090 est accessible"
          else
            echo "⚠️ Le port 8090 n'est pas encore accessible (peut être normal si l'API démarre encore)"
          fi
          
          # Vérifier que l'application Spring Boot démarre (en regardant les logs)
          echo "📋 Vérification des logs de démarrage..."
          LOGS=$(docker logs test-container 2>&1 | tail -20)
          echo "$LOGS"
          
          # Vérifier qu'il n'y a pas d'erreur fatale dans les logs
          if echo "$LOGS" | grep -i "error\|exception\|failed" | grep -v "MongoSocketOpenException\|Connection refused" | head -5; then
            echo "⚠️ Des erreurs ont été détectées dans les logs (mais pas bloquantes si ce sont des erreurs de connexion MongoDB)"
          fi
          
          # Vérifier que Spring Boot a commencé à démarrer
          if echo "$LOGS" | grep -i "started\|application\|spring" > /dev/null; then
            echo "✅ L'application Spring Boot a commencé à démarrer"
          else
            echo "⚠️ L'application Spring Boot ne semble pas avoir démarré (vérifiez les logs ci-dessus)"
          fi
          
          echo "✅ Test du conteneur terminé avec succès!"
          echo "ℹ️ Note: Le health check nécessite MongoDB qui n'est pas disponible dans ce test CI"
          
          # Nettoyage
          docker stop test-container || true
          docker rm test-container || true

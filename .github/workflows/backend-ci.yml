name: Backend CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: docker.io
  API_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blogpress-api
  PROXY_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blogpress-nginx

jobs:
  test:
    name: Tests Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew clean test

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          COMMIT_SHA=${{ github.sha }}
          docker build \
            -f setup-api/Dockerfile \
            -t $API_IMAGE_NAME:$COMMIT_SHA \
            -t $API_IMAGE_NAME:latest \
            .

      - name: Build Proxy image
        run: |
          COMMIT_SHA=${{ github.sha }}
          docker build \
            -f setup-proxy/Dockerfile \
            -t $PROXY_IMAGE_NAME:$COMMIT_SHA \
            -t $PROXY_IMAGE_NAME:latest \
            setup-proxy

      - name: Push image (only on push, pas sur PR)
        if: github.event_name == 'push'
        run: |
          COMMIT_SHA=${{ github.sha }}
          docker push $API_IMAGE_NAME:$COMMIT_SHA
          docker push $API_IMAGE_NAME:latest
          docker push $PROXY_IMAGE_NAME:$COMMIT_SHA
          docker push $PROXY_IMAGE_NAME:latest

version: '3.8'

services:
  # ===== BASE DE DONNÉES =====
  mongodb:
    image: mongo:7.0
    container_name: blogpress-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-qwerty87}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-blogpress}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - ./setup-db/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - blogpress-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["--auth"]

  # ===== API SPRING BOOT =====
  api:
    build:
      context: .
      dockerfile: setup-api/Dockerfile
    image: blogpress-api:${VERSION:-latest}
    container_name: blogpress-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-qwerty87}@mongodb:27017/${MONGO_DATABASE:-blogpress}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8090}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@blogpress.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2025}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      FILE_STORAGE_BASE_PATH: /app/uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    networks:
      - blogpress-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== NGINX REVERSE PROXY (OPTIONNEL - décommenter si besoin) =====
  # nginx:
  #   build:
  #     context: setup-proxy
  #     dockerfile: Dockerfile
  #   image: blogpress-nginx:latest
  #   container_name: blogpress-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "${NGINX_HTTP_PORT:-80}:80"
  #     - "${NGINX_HTTPS_PORT:-443}:443"
  #   volumes:
  #     - ./setup-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./setup-proxy/conf.d:/etc/nginx/conf.d:ro
  #     - nginx-logs:/var/log/nginx
  #   networks:
  #     - blogpress-network
  #   depends_on:
  #     - api

volumes:
  mongodb-data:
    name: blogpress-mongodb-data
    driver: local
  api-uploads:
    name: blogpress-api-uploads
    driver: local
  api-logs:
    name: blogpress-api-logs
    driver: local
  # nginx-logs:
  #   name: blogpress-nginx-logs

networks:
  blogpress-network:
    name: blogpress-network
    driver: bridge
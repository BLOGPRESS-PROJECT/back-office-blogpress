# ==========================================
# APPLICATION
# ==========================================
spring.application.name=blogpress-api
server.port=8090

# ==========================================
# PROFIL ACTIF
# ==========================================
spring.profiles.active=dev

# ==========================================
# Base URL pour les liens publics
# ==========================================
app.base-url=http://localhost:8090
app.frontend-url=http://localhost:3000

# ==========================================
# MONGODB (Développement Local)
# ==========================================
spring.data.mongodb.uri=mongodb://root:qwerty87@localhost:27017/blogpress?authSource=admin
spring.data.mongodb.auto-index-creation=true

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=VGhpcyBpcyBhIHZlcnkgc2VjdXJlIGFuZCBsb25nIHNlY3JldCBrZXkgZm9yIEJsb2dwcmVzcyBBUEkgMjAyNQ==
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# ==========================================
# FILE UPLOAD
# ==========================================
#file.upload-dir=uploads
#file.max-size=5MB
#file.allowed-types=image/jpeg,image/png,image/gif,image/webp
file.storage.base-path=./uploads
file.storage.max-file-size=5242880
file.storage.allowed-types=image/jpeg,image/png,image/gif,image/webp
file.storage.profile-pictures-path=profile-pictures
file.storage.blog-covers-path=blog-covers
file.storage.blog-logos-path=blog-logos
file.storage.article-covers-path=article-covers

# Spring Servlet Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# ADMIN PAR DÉFAUT
# ==========================================
admin.email=admin@blogpress.com
admin.password=Admin@2025
admin.username=admin
admin.firstname=Super
admin.lastname=Admin

# ==========================================
# LOGGING (Développement)
# ==========================================
logging.level.root=INFO
logging.level.com.kobe.blogpress_api=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# JACKSON
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ==========================================
# DEVTOOLS (Hot reload)
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true



spring.docker.compose.enabled=false